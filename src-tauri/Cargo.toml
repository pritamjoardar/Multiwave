[package]
name = "multiwave"
version = "0.1.0"
description = "MultiWave — Windows Multi-Device Audio Mixer"
authors = ["MultiWave Team"]
edition = "2021"

[lib]
name = "multiwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
parking_lot = "0.12"
directories = "5"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    "implement",
] }
windows-core = "0.58"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
